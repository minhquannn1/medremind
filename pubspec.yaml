name: medremind
description: "Medoly — medication adherence app (Flutter port)."
publish_to: 'none'

# Matches the React Native app's marketing version so store builds line up.
version: 1.0.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — replaces zustand.
  flutter_riverpod: ^2.6.1

  # Navigation — replaces expo-router's file-based routes.
  go_router: ^14.6.2

  # Local database — replaces expo-sqlite + drizzle-orm.
  sqflite: ^2.4.1
  path: ^1.9.0

  # Dates + i18n formatting — replaces dayjs.
  intl: ^0.20.2

  # Local notifications — replaces expo-notifications.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1

  # Camera + gallery — replaces expo-camera / expo-image-picker.
  image_picker: ^1.1.2

  # Runtime permissions — replaces the expo permission APIs.
  permission_handler: ^11.3.1

  # Real-device check — replaces expo-device (simulators cannot show alerts).
  device_info_plus: ^11.2.0

  # HTTP to the scan / auth / sync backend.
  http: ^1.2.2

  # Opens the privacy and support pages in the browser.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Runs real SQLite on the host so repository tests exercise actual SQL
  # instead of a mock that could drift from the schema.
  sqflite_common_ffi: ^2.3.4

  # Generates every launcher icon size from one source image, so a new icon
  # can never land on one platform at the wrong size or miss a density.
  flutter_launcher_icons: ^0.14.4

  # Generates the native launch screen for both platforms from one config, so
  # the app opens on the brand instead of a white flash.
  flutter_native_splash: ^2.4.4

  # Drives the real app on a simulator/device for end-to-end checks.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/

# Regenerate after changing assets/icon/icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  # iOS rejects icons with an alpha channel at upload, so it is flattened
  # against the brand teal rather than left transparent.
  remove_alpha_ios: true
  background_color_ios: "#0E7C7B"
  min_sdk_android: 21

# Regenerate after changing the icon or these values:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E7C7B"
  image: assets/icon/splash.png
  # Android 12+ draws its own splash from a separate, smaller canvas.
  android_12:
    color: "#0E7C7B"
    image: assets/icon/splash.png
  android: true
  ios: true
  web: false
