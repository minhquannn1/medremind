<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Medoly — medication reminders that work offline.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Medoly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Medoly</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="medoly-loader">
    <div class="logo">+</div>
    <div class="ring"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>
    /* First-load splash: the wasm bundle takes a few seconds on first visit,
       and a blank white page reads as broken. Removed on flutter-first-frame. */
    #medoly-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0E7C7B; transition: opacity .3s ease-out;
    }
    #medoly-loader .logo {
      width: 76px; height: 76px; border-radius: 20px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font: 700 40px system-ui, sans-serif; color: #0E7C7B;
    }
    #medoly-loader .ring {
      margin-top: 28px; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
      animation: medoly-spin 900ms linear infinite;
    }
    @keyframes medoly-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('medoly-loader');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 350);
    });
  </script>
  <script src="push.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
